
name: windows-msbuild-msvc-18
on:
  pull_request:
    paths:
      - '.github/**'
      - 'cmake/**'
      - 'cml/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'CML.cmake'
      - 'vcpkg.json'

jobs:
  build-and-test:
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - ver: "14.50"
          vsver: "18.0"
        - ver: "14.51"
          vsver: "18.6"
    env:
      MSVC_TOOLSET_VERSION: ${{ matrix.ver }}
    name: "(windows-msbuild-msvc-18-mt-s-vcpkg-${{ matrix.ver }})"
    runs-on: windows-2025-vs2026
    steps:
        # Set the number of CMake build and test jobs
      - name: Set CMake and CTest concurrency
        shell: pwsh
        run: |
          $ncore = (Get-WmiObject -Class Win32_Processor -Property NumberOfCores `
                   | Measure-Object -Property NumberOfCores -Sum).Sum
          "CMAKE_BUILD_PARALLEL_LEVEL=$($ncore)" | Out-File -Append $env:GITHUB_ENV
          "CTEST_PARALLEL_LEVEL=$($ncore)" | Out-File -Append $env:GITHUB_ENV
      - name: Install MSVC ${{ matrix.ver }}.${{ matrix.vsver }}
        shell: pwsh
        run: |
          # The CMake generator requires a specific Visual Studio major version, so
          # every lookup below is restricted to instances of that version. Selecting
          # "the newest instance" is not sufficient once a later Visual Studio is also
          # present on the image: the toolset gets installed into the wrong instance
          # and the generator then reports that it cannot find any instance at all.
          $vsmajor = [int]("${{ matrix.vsver }}".Split('.')[0])
          $workload = "Microsoft.VisualStudio.Component.VC.${{ matrix.ver }}.${{ matrix.vsver }}.x86.x64"

          Install-Module -Name VSSetup -Force

          $candidates = @(Get-VSSetupInstance -All | Where-Object { $_.InstallationVersion.Major -eq $vsmajor })
          if($candidates.Count -eq 0) {
            Write-Error "Could not locate a Visual Studio $($vsmajor) instance on this runner"
            Exit 1;
          }

          # Install to the newest instance of the required VS version:
          $vs = $candidates | Sort-Object -Property InstallationVersion -Descending | Select-Object -First 1
          $vspath = $vs.InstallationPath

          # Both CMake and vcpkg pick a toolset by matching the leading "<major>.<minor>"
          # of the directory names under VC\Tools\MSVC, so test for that directly rather
          # than for an installer component id. The toolset that ships as the image
          # default is not offered as a versioned side-by-side component, so requiring
          # its component id would fail even though the toolset is present.
          $toolsetroot = Join-Path $vspath 'VC\Tools\MSVC'
          $prefix = "${{ matrix.ver }}."

          Write-Host "Determining if MSVC ${{ matrix.ver }} is installed for $($vspath)..."
          $found = @(Get-ChildItem -Path $toolsetroot -Directory -ErrorAction SilentlyContinue `
                    | Where-Object { $_.Name.StartsWith($prefix) })
          if($found.Count -gt 0) {
            Write-Host "... MSVC $($found[0].Name) already installed"
          } else {

            $vsinstaller = 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe'
            if(!(Test-Path -Path $vsinstaller)) {
              Write-Error "Could not locate the Visual Studio installer"
              Exit 1;
            }

            Write-Host "... installing $($workload) for $($vspath)"
            Start-Process -NoNewWindow -Wait -FilePath $vsinstaller -ArgumentList `
              'modify', '--installPath', "`"$vspath`"", '--quiet', '--norestart', '--nocache', '--noUpdateInstaller', `
              '--add', "$($workload)"

            # Should exist now:
            $found = @(Get-ChildItem -Path $toolsetroot -Directory -ErrorAction SilentlyContinue `
                      | Where-Object { $_.Name.StartsWith($prefix) })
            if($found.Count -eq 0) {
              Write-Error "Installation of $($workload) for $($vspath) failed"
              Exit 1;
            }
            Write-Host "... installed MSVC $($found[0].Name)"
          }
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
        with:
          # Visual Studio 2026 requires CMake >= 4.2 for the "Visual Studio 18 2026" generator
          cmakeVersion: "~4.4.0"
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Build and test
        shell: pwsh
        run: |
           $preset = 'windows-msbuild-msvc-18-mt-s-vcpkg'
           Write-Host "Executing workflow $($preset) for MSVC $($env:MSVC_TOOLSET_VERSION) with VCPKG_ROOT @ $($env:VCPKG_ROOT)"
           cmake --workflow --preset=$preset
      - name: Generate JUnit test results
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: "ctest.xml"
          status-check-name: "windows-msbuild-msvc-18-mt-s-${{ matrix.ver }} CTest Report"
          status-check: true
          annotate: true
          summary: true
          use-suite-name: true
          file-report: true
          failed-report: true
          upload-artifact: false
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "ctrf.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": false,
                  "env": {
                    "appName": "cml"
                  }
                }
              }
            }
        if: ${{ always() }}
